<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline — Laboratorio de prototipado</title>
  <style>
    :root {
      --bg: linear-gradient(180deg,#edf2f8 0%,#f7f9fc 100%);
      --panel: #ffffff;
      --line: #d3dde8;
      --ink: #1a2533;
      --ink2: #415062;
      --ink3: #607086;
      --blue: #0b5fff;
      --green: #127a65;
      --green-bg: #e9f7f3;
      --green-border: #bfe8dd;
      --bad: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(23,33,43,.06);
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: var(--blue);
      text-decoration: none; border: 1px solid #c5d7f2;
      background: #eef4ff; border-radius: 999px; padding: 6px 12px;
      transition: background .12s;
    }
    .back-link:hover { background: #dde9ff; }
    .header-title {
      font-size: 20px; font-weight: 800; color: var(--ink); flex: 1;
    }
    .ctrl-group { display: flex; align-items: center; gap: 6px; }
    .ctrl-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      border: 1.5px solid var(--line); background: var(--panel);
      border-radius: 999px; font-size: 18px; font-weight: 700;
      color: var(--ink2); cursor: pointer; transition: background .12s, transform .1s;
      user-select: none;
    }
    .ctrl-btn:hover { background: #eef2f7; transform: scale(1.07); }
    .ctrl-btn-text {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1.5px solid var(--line); background: var(--panel);
      border-radius: 999px; padding: 6px 14px; font-size: 12px;
      font-weight: 700; color: var(--blue); cursor: pointer;
      transition: background .12s;
    }
    .ctrl-btn-text:hover { background: #eef4ff; }
    .refresh-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); display: inline-block;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 210px;
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-spacer {
      height: 48px; /* same height as time-axis-header */
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex-shrink: 0;
    }
    .sidebar-rows {
      flex: 1;
      overflow-y: auto;
    }
    .printer-row-sidebar {
      height: 80px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .printer-icon-wrap {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 10px; overflow: hidden;
      background: #d8dde4;
      border: 1px solid #c4ccd6;
      display: flex; align-items: center; justify-content: center;
    }
    .printer-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #e7ebf1;
    }
    .printer-icon-wrap svg { width: 42px; height: 42px; display: block; }
    .printer-info { min-width: 0; }
    .printer-name-label {
      font-size: 14px; font-weight: 800; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .printer-status-label {
      font-size: 11px; font-weight: 600; color: var(--ink3);
      display: flex; align-items: center; gap: 4px; margin-top: 2px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-printing { background: var(--blue); }
    .dot-paused   { background: #f59e0b; }
    .dot-standby  { background: var(--blue); }
    .dot-complete { background: var(--green); }
    .dot-offline  { background: #9aa5b1; }
    .dot-error    { background: var(--bad); }

    /* ── TIMELINE AREA ── */
    .timeline-outer {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .timeline-scroll {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      cursor: grab;
    }
    .timeline-scroll:active { cursor: grabbing; }
    .timeline-inner {
      position: relative;
      height: 100%;
      /* width set by JS */
    }

    /* Time axis header */
    .time-axis-header {
      height: 48px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      pointer-events: none;
    }
    .time-label {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
    }
    .time-label-date {
      font-size: 10px; font-weight: 700; color: var(--ink3);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .time-label-hour {
      font-size: 12px; font-weight: 600; color: var(--ink2); margin-top: 1px;
    }
    .time-label-now .time-label-hour {
      color: var(--blue); font-weight: 800;
    }

    /* Grid lines */
    .grid-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: var(--line);
      opacity: .7;
      pointer-events: none;
    }

    /* Now line */
    .now-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--blue);
      z-index: 8;
      pointer-events: none;
    }
    .now-dot {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--blue);
    }

    /* Printer rows in timeline */
    .printer-row-timeline {
      position: absolute;
      left: 0; right: 0;
      height: 80px;
      border-bottom: 1px solid var(--line);
    }
    .printer-row-timeline:nth-child(odd) { background: #fafcfe; }
    .printer-row-timeline:nth-child(even) { background: #f4f7fc; }

    /* Job blocks */
    .job-block {
      position: absolute;
      top: 10px;
      height: 60px;
      border-radius: 10px;
      padding: 6px 10px;
      overflow: hidden;
      cursor: default;
      border: 1.5px solid;
      transition: filter .1s, transform .1s;
    }
    .job-block:hover { filter: brightness(.96); transform: scaleY(1.02); z-index: 5; }
    .job-block.printing  { background: #dbeafe; border-color: #93c5fd; }
    .job-block.paused    { background: #fef3c7; border-color: #fcd34d; }
    .job-block.completed { background: var(--green-bg); border-color: var(--green-border); }
    .job-block.queued    { background: #f3f4f6; border-color: #d1d5db; }
    .job-block.error     { background: #fee2e2; border-color: #fca5a5; }
    .job-block-name {
      font-size: 12px; font-weight: 700; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-block-meta {
      font-size: 11px; color: var(--ink3); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 4px;
    }
    .job-block-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* Loading / empty state */
    .loading-row {
      position: absolute;
      height: 80px;
      display: flex;
      align-items: center;
      padding-left: 16px;
      font-size: 12px;
      color: var(--ink3);
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      z-index: 100;
      background: #1a2533;
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      max-width: 260px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-name { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
    .tooltip-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 3px; color: #c8d5e4; }

    /* Scrollbar */
    .timeline-scroll::-webkit-scrollbar { height: 6px; }
    .timeline-scroll::-webkit-scrollbar-track { background: #edf2f8; }
    .timeline-scroll::-webkit-scrollbar-thumb { background: #c5d0db; border-radius: 3px; }
    .layout,.timeline-outer,.timeline-scroll{min-width:0;min-height:0}.printer-row-timeline:nth-child(odd){background:var(--panel)}.printer-row-timeline:nth-child(even){background:color-mix(in srgb,var(--panel),var(--line) 12%)}
    .printer-eta{font-size:10px;font-weight:750;color:var(--green);margin-top:4px;line-height:1.25}
    .printer-queue{font-size:10px;color:var(--ink3);margin-top:2px}.printer-icon-wrap{width:30px;height:30px}.printer-row-sidebar{padding:0 10px;gap:8px}
    .job-eta{font-size:10px;font-weight:800;margin-top:3px;color:var(--ink2);white-space:nowrap}.job-block{cursor:pointer}.job-block:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.job-block.cancelled{background:#fff0e5;border-color:#e7a57b}
    .tooltip.pinned{pointer-events:auto}.tooltip-close{display:none;margin-top:10px;border:1px solid #849aaa;background:transparent;color:white;border-radius:6px;padding:5px 12px;cursor:pointer}.tooltip.pinned .tooltip-close{display:block}.tooltip-name{overflow-wrap:anywhere}.tooltip{max-width:280px}
    .timeline-scroll{overflow-y:auto}.sidebar-rows{scrollbar-width:none}.timeline-message{font-size:11px;padding:8px 16px;color:var(--ink3);background:var(--panel);border-bottom:1px solid var(--line)}
    @media(max-width:650px){.header{padding:10px;gap:8px;flex-wrap:wrap}.header-title{font-size:18px}.ctrl-group{margin-left:auto}.back-link{padding:6px 9px}.sidebar{width:158px}.printer-name-label{font-size:12px}.printer-eta{font-size:9px}.printer-icon-wrap{display:none}.tooltip.pinned{left:12px!important;right:12px;top:auto!important;bottom:20px;max-width:none}.ctrl-btn-text{padding:6px 8px;font-size:11px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101917;--panel:#18241f;--line:#304239;--ink:#e5eee9;--ink2:#c2d2c8;--ink3:#9db2a8;--blue:#90b8ff;--green:#7bdab0;--green-bg:#1b3b2b;--green-border:#3d7757;--bad:#ff9b91}.sidebar-spacer,.time-axis-header{background:#1d2b25}.back-link{background:#203451;border-color:#42618e;color:#c3d9ff}.ctrl-btn:hover,.ctrl-btn-text:hover{background:#304239}.job-block.printing{background:#213c59;border-color:#547cad}.job-block.paused{background:#4a3919;border-color:#8d702f}.job-block.queued{background:#2c3430;border-color:#57635c}.job-block.error,.job-block.cancelled{background:#4c2925;border-color:#9c5d54}.printer-icon-wrap img{background:#bcc5c0}.timeline-scroll::-webkit-scrollbar-track{background:#18241f}.timeline-scroll::-webkit-scrollbar-thumb{background:#52675b}}

</style>

  </a>
  <div class="header-title"><span class="timeline-eyebrow">LABORATORIO · PLANIFICACIÓN</span><h1>Línea del tiempo</h1></div>
  <div class="ctrl-group">
    <button class="ctrl-btn" id="btnZoomOut" title="Alejar">−</button>

<script src="./timeline-speed.js?v=20261103-3"></script>
<script>
  /* ────────────────────────────────────────────────
     CONFIGURACIÓN
  ──────────────────────────────────────────────── */
  const PRINTERS = [
    { id: 'SE01', ip: '192.0.2.11', name: 'SE01' },
    { id: 'SE02', ip: '192.0.2.12', name: 'SE02' },
    { id: 'MA01', ip: '192.0.2.13', name: 'MA01' },
    { id: 'INTAMSYS', ip: '192.0.2.16', name: 'HT09' },
    { id: 'IDEX', name: '22IDEX V3' },
  ];
  const PRINT_BROKER_URL = 'http://192.0.2.14:8120';
  const PRINT_HOST_DEVICE = { id: 'PrintHost', ip: '192.0.2.14', name: 'Print Host', kind: 'print_host' };

  const FETCH_TIMEOUT = 45000;
  const HISTORY_LIMIT = 10;
  const RENDER_SPAN_H = 216;      // 48h base + 1 semana adicional
  const RENDER_BEFORE_H = 24;     // incluye trabajos terminados del último día
  const REFRESH_INTERVAL = 30000; // ms

  let pixelsPerHour = 65;
  const ZOOM_STEP = 1.4;
  const ZOOM_MIN = 40;
  const ZOOM_MAX = 400;

  /* ────────────────────────────────────────────────
     ESTADO
  ──────────────────────────────────────────────── */
  // windowStartMs: timestamp del extremo izquierdo del área renderizada
  let windowStartMs = Date.now() - RENDER_BEFORE_H * 3600000;
  let printerData = [];   // [{ printer, jobs, state, currentFile }]

  /* ────────────────────────────────────────────────
     UTILS
  ──────────────────────────────────────────────── */
  function tsToX(ts) {
    return ((ts - windowStartMs) / 3600000) * pixelsPerHour;
  }

  function fmtDuration(ms) {
    const totalMin = Math.round(ms / 60000);
    if (totalMin < 60) return `${totalMin} Min`;
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return m > 0 ? `${h} H ${m} Min` : `${h} H`;
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    const h = d.getHours();
    const min = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    return `${h12}:${min} ${ampm}`;
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
  }

  function shortName(filename) {
    return escapeHtml(filename ? filename.replace(/\.gcode$/i,'') : '—');
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  const PRINTER_IMAGE_URL = './printer-reference.svg';
  const PRINT_HOST_IMAGE_URL = './label-printer.jpg';

  function printerIconSvg() {
    return `<svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#6c7280"/>
          <stop offset="1" stop-color="#434853"/>
        </linearGradient>
      </defs>
      <rect width="42" height="42" rx="10" fill="#f2f5f9"/>
      <rect x="10" y="7" width="22" height="18" rx="2.6" fill="url(#g)"/>
      <rect x="8" y="24" width="26" height="10" rx="2.2" fill="#2e3340"/>
      <rect x="13" y="26.2" width="16" height="5.4" rx="1.4" fill="#1a1e27"/>
      <rect x="14" y="10" width="14" height="2.8" rx="1" fill="rgba(255,255,255,.22)"/>
      <rect x="11" y="34.5" width="20" height="2" rx="1" fill="#8f98a7"/>
    </svg>`;
  }

  function printerIconMarkup(printerId) {
    const alt = `Impresora ${printerId}`;
    const fallback = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(printerIconSvg())}`;
    const src = printerId.startsWith('PrintHost') ? PRINT_HOST_IMAGE_URL : PRINTER_IMAGE_URL;
    return `<img src="${src}" alt="${alt}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">`;
  }

  /* ────────────────────────────────────────────────
     FETCH
  ──────────────────────────────────────────────── */
  async function fetchJson(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      return r.ok ? r.json() : null;
    } catch { clearTimeout(timer); return null; }
  }

  async function getPrinterData(printer) {
    const base = `http://${printer.ip}`;
    const jobs = [];
    let state = 'offline';
    let currentFile = null;

    const [stateData, histData, queueData] = await Promise.allSettled([
      fetchJson(`${base}/printer/objects/query?print_stats&virtual_sdcard`),
      fetchJson(`${base}/server/history/list?limit=${HISTORY_LIMIT}&order=desc`),
      fetchJson(`${base}/server/job_queue/status`)
    ]);

    const now = Date.now();

    // Current job
    const sd = stateData.status === 'fulfilled' ? stateData.value : null;
    if (sd?.result?.status?.print_stats) {
      const ps = sd.result.status.print_stats;
      const vs = sd.result.status.virtual_sdcard;
      state = ps.state || 'offline';
      currentFile = ps.filename;

      if (ps.state === 'printing' || ps.state === 'paused') {
        const printDuration = (ps.print_duration || 0) * 1000;
        const progress = vs?.progress || 0;
        const startMs = now - printDuration;

        let endMs;
        if (progress > 0.01) {
          const estimatedTotal = (ps.print_duration / progress) * 1000;
          endMs = startMs + estimatedTotal;
        } else {
          endMs = now + 3600000;
        }

        jobs.push({
          filename: ps.filename,
          startMs,
          endMs,
          state: ps.state,
          isCurrent: true,
          progress: progress
        });
      }
    }

    // History
    const hd = histData.status === 'fulfilled' ? histData.value : null;
    if (hd?.result?.jobs) {
      for (const j of hd.result.jobs) {
        if (j.status === 'completed' && j.start_time && j.end_time) {
          jobs.push({
            filename: j.filename,
            startMs: j.start_time * 1000,
            endMs: j.end_time * 1000,
            state: 'completed',
            isCurrent: false
          });
        }
      }
    }

    // Queue
    const qd = queueData.status === 'fulfilled' ? queueData.value : null;
    if (qd?.result?.queued_jobs?.length) {
      let nextStart = jobs.find(j => j.isCurrent)?.endMs || now;
      for (const qj of qd.result.queued_jobs) {
        // Try metadata for estimated time
        const meta = await fetchJson(`${base}/server/files/metadata?filename=${encodeURIComponent(qj.filename)}`);
        const est = (meta?.result?.estimated_time || 3600) * 1000;
        jobs.push({
          filename: qj.filename,
          startMs: nextStart,
          endMs: nextStart + est,
          state: 'queued',
          isCurrent: false
        });
        nextStart += est;
      }
    }

    return { printer, jobs, state, currentFile };
  }

  async function getPrintHostData() {
    const [healthData, printsData] = await Promise.allSettled([
      fetchJson(`${PRINT_BROKER_URL}/health?ts=${Date.now()}`),
      fetchJson(`${PRINT_BROKER_URL}/prints?ts=${Date.now()}`)
    ]);

    const state = (healthData.status === 'fulfilled' && healthData.value?.ok) ? 'standby' : 'offline';
    const events = (printsData.status === 'fulfilled' && printsData.value?.events) ? printsData.value.events : [];
    const jobs = [];

    for (const ev of events) {
      if (!ev || !ev.ts) continue;
      const startMs = Number(ev.ts) * 1000;
      const endMs = startMs + (8 * 60 * 1000);
      const printerSuffix = ev.printer ? ` [${ev.printer}]` : '';
      jobs.push({
        filename: `Etiqueta${printerSuffix} ${shortName(ev.filename || '')}`,
        startMs,
        endMs,
        state: 'completed',
        isCurrent: false,
        source: 'print_host'
      });
    }

    return { printer: PRINT_HOST_DEVICE, jobs, state, currentFile: null };
  }

  async function loadAll() {
    if(window.timelineSpeedEditing)return;
    const snapshot = await fetchJson('./api/timeline');
    if(window.timelineSpeedEditing)return;
    if (snapshot?.rows) {
      printerData = snapshot.rows;
      render();
      document.getElementById('timeline-message').textContent = 'Actualizado ' + new Date(snapshot.updated).toLocaleTimeString('es-MX') + ' · Horarios estimados, no garantizados';
    } else {
      document.getElementById('timeline-message').textContent = 'No se pudo actualizar. Se conserva la última consulta.';
    }
    return;
    /* Legacy adapters retained for reference; data now comes from the central read-only API.
    const results = await Promise.allSettled(PRINTERS.map(p => getPrinterData(p)));
    const baseRows = results.map((r, i) => {
      if (r.status === 'fulfilled') return r.value;
      return { printer: PRINTERS[i], jobs: [], state: 'offline', currentFile: null };
    });

    let phRow = { printer: PRINT_HOST_DEVICE, jobs: [], state: 'offline', currentFile: null };
    try {
      phRow = await getPrintHostData();
    } catch (_) {}

    printerData = [...baseRows, phRow];
    render();
    */
  }

  /* ────────────────────────────────────────────────
     RENDER
  ──────────────────────────────────────────────── */
  function render() {
    const now = Date.now();
    windowStartMs = now - RENDER_BEFORE_H * 3600000;
    const totalWidthPx = RENDER_SPAN_H * pixelsPerHour;
    const totalHeightPx = 48 + printerData.length * 80;

    const inner = document.getElementById('timelineInner');
    inner.style.width = `${totalWidthPx}px`;
    inner.style.height = `${totalHeightPx}px`;

    renderTimeAxis(totalWidthPx, now);
    renderGridLines(totalWidthPx, totalHeightPx, now);
    renderNowLine(totalHeightPx, now);
    renderSidebar();
    renderPrinterRows(totalWidthPx, now);

    // Scroll so "Now" is visible (~1/4 from left of viewport)
    const scroll = document.getElementById('timelineScroll');
    const nowX = tsToX(now);
    const viewW = scroll.clientWidth;
    const targetScroll = nowX - viewW * 0.25;
    if (scroll._firstRender !== false) {
      scroll.scrollLeft = Math.max(0, targetScroll);
      scroll._firstRender = false;
    }
    positionJobLabels();
  }

  function positionJobLabels(){
    const scroll=document.getElementById('timelineScroll');
    for(const content of document.querySelectorAll('.job-content')){
      const block=content.parentElement,left=parseFloat(block.style.left)||0,width=parseFloat(block.style.width)||0;
      const shift=Math.max(0,Math.min(width-70,scroll.scrollLeft-left+12));
      content.style.transform='translateX('+shift+'px)';
      content.style.width=Math.max(20,Math.min(width-shift-36,scroll.clientWidth-40))+'px';
    }
  }
  document.getElementById('timelineScroll').addEventListener('scroll',positionJobLabels,{passive:true});
  function renderTimeAxis(totalWidthPx, now) {
    const header = document.getElementById('timeAxisHeader');
    header.innerHTML = '';
    header.style.width = `${totalWidthPx}px`;

    // "Now" label
    const nowX = tsToX(now);
    const nowLabel = document.createElement('div');
    nowLabel.className = 'time-label time-label-now';
    nowLabel.style.left = `${nowX}px`;
    nowLabel.innerHTML = `<span class="time-label-hour" style="color:var(--blue)">Ahora</span>`;
    header.appendChild(nowLabel);

    // Hourly ticks — show every 2h (or 4h if zoomed out)
    const tickInterval = pixelsPerHour < 60 ? 4 : 2;
    let prevDate = '';
    const startH = Math.ceil((windowStartMs) / (tickInterval * 3600000)) * tickInterval;
    const endH = windowStartMs + RENDER_SPAN_H * 3600000;

    for (let ts = startH * 3600000; ts <= endH; ts += tickInterval * 3600000) {
      const x = tsToX(ts);
      if (Math.abs(x-nowX)<48) continue;
      const d = new Date(ts);
      const h = d.getHours();
      const hAMPM = h % 12 || 12;
      const ampm = h >= 12 ? 'PM' : 'AM';
      const dateStr = fmtDate(ts);

      const el = document.createElement('div');
      el.className = 'time-label';
      el.style.left = `${x}px`;

      let html = '';
      if (dateStr !== prevDate && h < tickInterval * 2) {
        html += `<span class="time-label-date">${dateStr}</span>`;
        prevDate = dateStr;
      } else if (dateStr !== prevDate) {
        html += `<span class="time-label-date">${dateStr}</span>`;
        prevDate = dateStr;
      }
      html += `<span class="time-label-hour">${hAMPM} ${ampm}</span>`;
      el.innerHTML = html;
      header.appendChild(el);
    }
  }

  function renderGridLines(totalWidthPx, totalHeightPx, now) {
    const container = document.getElementById('gridLines');
    container.innerHTML = '';

    const tickInterval = pixelsPerHour < 60 ? 4 : 2;
    const endH = windowStartMs + RENDER_SPAN_H * 3600000;
    const startH = Math.ceil(windowStartMs / (tickInterval * 3600000)) * tickInterval;

    for (let ts = startH * 3600000; ts <= endH; ts += tickInterval * 3600000) {
      const x = tsToX(ts);
      const line = document.createElement('div');
      line.className = 'grid-line';
      line.style.left = `${x}px`;
      line.style.top = '48px';
      line.style.height = `${totalHeightPx - 48}px`;
      container.appendChild(line);
    }
  }

  function renderNowLine(totalHeightPx, now) {
    const line = document.getElementById('nowLine');
    const x = tsToX(now);
    line.style.left = `${x}px`;
    line.style.top = '48px';
    line.style.height = `${totalHeightPx - 48}px`;
  }

  function renderSidebar() {
    const rows = document.getElementById('sidebarRows');
    rows.innerHTML = '';

    for (const pd of printerData) {
      const { printer, state } = pd;
      const stateLabel = {
        printing: 'Imprimiendo',
        paused: 'Pausado',
        standby: 'Listo',
        queued: 'En cola',
        complete: 'Completado',
        error: 'Error',
        offline: 'Offline'
      }[state] || state;

      const dotClass = {
        printing: 'dot-printing',
        paused: 'dot-paused',
        standby: 'dot-standby',
        complete: 'dot-complete',
        error: 'dot-error',
        offline: 'dot-offline'
      }[state] || 'dot-offline';

      const row = document.createElement('div');
      row.className = 'printer-row-sidebar';
      const current = pd.jobs.find(job => job.isCurrent);
      const finish = current ? (current.etaKnown ? 'Sale ≈ ' + fmtTime(current.endMs) + ' · ' + fmtDate(current.endMs) : 'Sin hora estimada') : '';
      row.innerHTML = `
        <div class="printer-icon-wrap">${printerIconMarkup(printer.id)}</div>
        <div class="printer-info">
          <div class="printer-name-label">${escapeHtml(printer.name || printer.id)}</div>
          <div class="printer-status-label">
            <span class="status-dot ${dotClass}"></span>
            ${stateLabel}
          </div>
          <div class="printer-eta">${finish || (pd.printer.kind==='print_host' ? escapeHtml(pd.note || '') : '')}</div>
          ${pd.unscheduledQueue ? '<div class="printer-queue">'+pd.unscheduledQueue+' en cola · sin horario</div>' : ''}
        </div>
      `;
      if(current?.speedTicket && current.state==='printing' && current.etaKnown){
        const adjust=document.createElement('button');adjust.type='button';adjust.className='speed-quick';
        adjust.textContent='Ajustar · '+current.speedPercent+' %';adjust.setAttribute('aria-label','Ajustar velocidad de '+printer.name);
        adjust.onclick=()=>window.timelineSpeedOpeners?.[printer.id]?.();row.querySelector('.printer-info').append(adjust);
      }
      rows.appendChild(row);
    }
  }

  function renderPrinterRows(totalWidthPx, now) {
    const container = document.getElementById('printerRows');
    container.innerHTML = '';
    window.timelineSpeedOpeners={};

    printerData.forEach((pd, idx) => {
      const row = document.createElement('div');
      row.className = 'printer-row-timeline';
      row.style.top = `${48 + idx * 80}px`;
      row.style.width = `${totalWidthPx}px`;

      for (const job of pd.jobs) {
        const x1 = tsToX(job.startMs);
        const x2 = tsToX(job.endMs);
        const w = Math.max(x2 - x1, 4);

        // Skip if completely out of view
        if (x2 < -200 || x1 > totalWidthPx + 200) continue;

        const block = document.createElement('div');
        block.className = `job-block ${job.state}`;
        block.tabIndex = 0;
        block.setAttribute('role', 'button');
        block.setAttribute('aria-label', `${pd.printer.id}: ${job.filename}. ${job.etaKnown === false ? 'Sin hora estimada' : 'Fin ' + fmtTime(job.endMs)}`);
        block.style.left = `${Math.max(x1, 0)}px`;
        block.style.width = `${w - (x1 < 0 ? -x1 : 0)}px`;

        const durMs = job.endMs - job.startMs;
        const stateLabel = {
          printing: 'Imprimiendo',
          paused: 'Pausado',
          completed: 'Completado',
          queued: 'En cola',
          cancelled: 'Cancelado',
          error: 'Error'
        }[job.state] || job.state;

        const finalStateLabel = (pd.printer.kind === 'print_host' && job.state === 'completed')
          ? 'Impresión registrada'
          : stateLabel;

        const dotColors = {
          printing: 'var(--blue)',
          paused: '#f59e0b',
          completed: 'var(--green)',
          queued: '#9aa5b1',
          error: 'var(--bad)'
        };

        block.innerHTML = `
          <div class="job-block-name">${shortName(job.filename)}</div>
          <div class="job-block-meta">
            <span class="job-block-dot" style="background:${dotColors[job.state]||'#9aa5b1'}"></span>
            ${job.eventOnly ? 'Registro · duración no disponible' : finalStateLabel+' &nbsp; '+fmtDuration(durMs)}
          </div>
        `;
        if (job.isCurrent || job.state === 'queued') {
          const eta = document.createElement('div'); eta.className = 'job-eta';
          eta.textContent = job.etaKnown === false ? 'Sin hora estimada' : 'Salida ≈ ' + fmtTime(job.endMs) + ' · ' + fmtDate(job.endMs);
          if(job.speedPercent)eta.textContent+=' · '+Math.round(job.speedPercent*100)/100+' %';
          block.append(eta);
        }

        const content=document.createElement('div');content.className='job-content';
        while(block.firstChild)content.append(block.firstChild);block.append(content);
        // Tooltip
        block.addEventListener('mouseenter', (e) => showTooltip(e, job, pd.printer));
        block.addEventListener('mousemove', (e) => moveTooltip(e));
        block.addEventListener('mouseleave', hideTooltip);
        const openDetails = event => {
          event.stopPropagation();
          const rect = block.getBoundingClientRect();
          showTooltip({clientX: Math.max(10,Math.min(rect.left,window.innerWidth-285)), clientY:rect.top}, job, pd.printer);
          tooltipEl.classList.add('pinned');
        };
        block.addEventListener('click', openDetails);
        block.addEventListener('keydown', event => {if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetails(event);}});

        window.attachSpeedHandle(block,job,pd);
        row.appendChild(block);
      }

      container.appendChild(row);
    });
  }

  /* ────────────────────────────────────────────────
     TOOLTIP
  ──────────────────────────────────────────────── */
  const tooltipEl = document.getElementById('tooltip');

  function showTooltip(e, job, printer) {
    const dur = job.endMs - job.startMs;
    const progress = job.progress != null ? ` · ${Math.round(job.progress * 100)}%` : '';
    tooltipEl.innerHTML = `
      <div class="tooltip-name">${shortName(job.filename)}</div>
      <div class="tooltip-row"><span>Impresora</span><span>${escapeHtml(printer.name || printer.id)}</span></div>
      <div class="tooltip-row"><span>Inicio</span><span>${fmtTime(job.startMs)}, ${fmtDate(job.startMs)}</span></div>
      <div class="tooltip-row"><span>${job.isCurrent || job.estimated ? 'Salida estimada' : 'Fin registrado'}</span><span>${job.etaKnown === false ? 'No disponible' : fmtTime(job.endMs)+', '+fmtDate(job.endMs)}</span></div>
      ${job.eventOnly ? '<div class="tooltip-row">Registro de creación · duración no disponible</div>' : '<div class="tooltip-row"><span>'+ (job.estimated ? 'Duración estimada' : 'Duración') +'</span><span>'+fmtDuration(dur)+progress+'</span></div>'}
      ${job.legacy ? '<div class="tooltip-row">Registro heredado: duración no validada</div>' : ''}
      ${job.estimated ? '<div class="tooltip-row">El horario puede cambiar durante la impresión.</div>' : ''}
      <button type="button" class="tooltip-close" onclick="this.parentElement.classList.remove('visible','pinned')">Cerrar</button>
    `;
    moveTooltip(e);
    tooltipEl.classList.add('visible');
  }

  function moveTooltip(e) {
    const tw = 270, th = 140;
    let left = e.clientX + 14;
    let top = e.clientY + 14;
    if (left + tw > window.innerWidth) left = e.clientX - tw - 14;
    if (top + th > window.innerHeight) top = e.clientY - th - 14;
    tooltipEl.style.left = `${Math.max(8,left)}px`;
    tooltipEl.style.top = `${Math.max(8,top)}px`;
  }

  function hideTooltip() {
    if (tooltipEl.classList.contains('pinned')) return;
    tooltipEl.classList.remove('visible');
  }
  document.addEventListener('keydown', event => {if(event.key==='Escape'){tooltipEl.classList.remove('visible','pinned');}});

  /* ────────────────────────────────────────────────
     CONTROLES
  ──────────────────────────────────────────────── */
  document.getElementById('btnZoomIn').addEventListener('click', () => {
    pixelsPerHour = Math.min(pixelsPerHour * ZOOM_STEP, ZOOM_MAX);
    rerender();
  });

  document.getElementById('btnZoomOut').addEventListener('click', () => {
    pixelsPerHour = Math.max(pixelsPerHour / ZOOM_STEP, ZOOM_MIN);
    rerender();
  });

  document.getElementById('btnNow').addEventListener('click', () => {
    const scroll = document.getElementById('timelineScroll');
    const nowX = tsToX(Date.now());
    const viewW = scroll.clientWidth;
    scroll.scrollTo({ left: Math.max(0, nowX - viewW * 0.25), behavior: 'smooth' });
  });

  // Scroll with mouse wheel (horizontal)
  const timelineScroll = document.getElementById('timelineScroll');
  const sidebarScroll = document.getElementById('sidebarRows');
  timelineScroll.addEventListener('scroll',()=>{sidebarScroll.scrollTop=timelineScroll.scrollTop;});
  sidebarScroll.addEventListener('scroll',()=>{timelineScroll.scrollTop=sidebarScroll.scrollTop;});
  document.getElementById('timelineScroll').addEventListener('wheel', (e) => {
    if (e.deltaY !== 0 && e.deltaX === 0) {
      e.preventDefault();
      document.getElementById('timelineScroll').scrollLeft += e.deltaY * 2;
    }
  }, { passive: false });

  // Drag to scroll
  (function() {
    const el = document.getElementById('timelineScroll');
    let isDragging = false, startX = 0, startScroll = 0;
    el.addEventListener('mousedown', (e) => {
      if (e.target.closest('.job-block')) return;
      isDragging = true; startX = e.clientX; startScroll = el.scrollLeft;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      el.scrollLeft = startScroll - (e.clientX - startX);
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
  })();

  function rerender() {
    if(window.timelineSpeedEditing)return;
    const scroll = document.getElementById('timelineScroll');
    const prevNowX = tsToX(Date.now());
    const prevScrollLeft = scroll.scrollLeft;
    const prevOffset = prevScrollLeft - prevNowX;

    windowStartMs = Date.now() - RENDER_BEFORE_H * 3600000;
    const totalWidthPx = RENDER_SPAN_H * pixelsPerHour;
    const totalHeightPx = 48 + printerData.length * 80;

    const inner = document.getElementById('timelineInner');
    inner.style.width = `${totalWidthPx}px`;
    inner.style.height = `${totalHeightPx}px`;

    renderTimeAxis(totalWidthPx, Date.now());
    renderGridLines(totalWidthPx, totalHeightPx, Date.now());
    renderNowLine(totalHeightPx, Date.now());
    renderPrinterRows(totalWidthPx, Date.now());

    const newNowX = tsToX(Date.now());
    scroll.scrollLeft = newNowX + prevOffset;positionJobLabels();
  }

  /* ────────────────────────────────────────────────
     INIT
  ──────────────────────────────────────────────── */
  // Render skeleton first
  (function renderSkeleton() {
    printerData = [
      ...PRINTERS.map(p => ({ printer: p, jobs: [], state: 'offline', currentFile: null })),
      { printer: PRINT_HOST_DEVICE, jobs: [], state: 'offline', currentFile: null }
    ];
    render();
  })();

  loadAll();
  setInterval(loadAll, REFRESH_INTERVAL);
</script>
</body>
